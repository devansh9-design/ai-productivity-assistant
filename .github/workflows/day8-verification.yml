name: Day 8 verification

on:
  push:
    branches:
      - day-8
  pull_request:
    branches:
      - day-8

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      GEMINI_API_KEY: ci-placeholder
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
      CRON_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        # Not `npm ci`: the committed lockfile omits the Linux-only optional
        # peer packages (@emnapi/core/runtime, pulled in by the wasm32-wasi
        # resolver binding) because it was last generated on Windows, and
        # `npm ci` refuses a lockfile that is not a complete match for the
        # runner's platform. `npm install` honors the pinned versions and
        # fills in the platform optionals. Restore `npm ci` once the lockfile
        # is regenerated on Linux.
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        run: git diff --check